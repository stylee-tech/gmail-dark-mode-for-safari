<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Store previews — sample content</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10151e;color:#edf2fa;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.page{padding:48px 64px;height:800px;background:radial-gradient(ellipse at 90% 5%,#233d60,transparent 60%)}.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:#a9c5ff}.brand img{width:40px;height:40px;border-radius:10px}h1{font-size:48px;line-height:1.1;letter-spacing:-1.8px;margin:24px 0 12px}p{color:#bac7d9;font-size:19px;line-height:1.5;margin:0}iframe{border:1px solid #3c4b60;border-radius:18px;width:100%;height:462px;margin-top:28px;background:#202733;box-shadow:0 25px 75px #0005}.caption{font-size:12px;color:#97a9c0;margin-top:16px}.split{display:grid;grid-template-columns:1fr 350px;gap:48px;align-items:center}.split iframe{height:500px;width:302px;justify-self:end}.split h1{font-size:60px}.bullet{margin-top:28px;font-size:20px;line-height:1.6;color:#c4d0e0}strong{color:#eff4fb}</style>
<div class="page"><div class="brand"><img src="../../extension/icons/icon-128.png">Gmail Dark Mode for Safari</div><div id="layout"><h1 id="headline"></h1><p id="subtitle"></p><iframe id="demo" title="Extension styling with sample content"></iframe><p class="caption" id="caption">Sample content · Rendered with the extension’s styles</p></div></div>
<script>
const view=new URLSearchParams(location.search).get('view')||'gmail';
const demo=document.querySelector('#demo');
const header=(title)=>`<header style="padding:20px 26px;background:#1b202a;color:#eef2f7;border-bottom:1px solid #394456;font-size:19px;font-weight:600">${title}<span style="float:right;font-size:13px;color:#aeb7c5">Sample content</span></header>`;
const doc=(css,body,script='')=>`<!doctype html><html data-sdm-product="${view==='sheets'?'sheets':'gmail'}"><base href="${new URL('../../extension/',location.href)}"><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="${css}.css"><style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,Arial,sans-serif}button{font:inherit}a{color:#8ab4f8}</style>${body}<script>${script}<\/script></html>`;
if(view==='gmail'){
 document.querySelector('#headline').textContent='A softer inbox. A clearer read.';
 document.querySelector('#subtitle').textContent='Dark appearance across Gmail’s inbox, messages, and compose window.';
 const rows=[['Maya Chen','The weekend reading list','10:24 AM'],['Studio Notes','A new idea for your next project','9:10 AM'],['Alex Rivera','Coffee next week?','Yesterday'],['Team Updates','Your weekly roundup','Yesterday'],['Book Club','Our next chapter','Monday'],['Travel Notes','A little inspiration','Monday']].map((r,i)=>`<div class="zA" style="padding:19px 18px;border-bottom:1px solid #394456;display:grid;grid-template-columns:22px 100px 1fr 75px;gap:8px;font-size:13px"><span>☆</span><strong>${r[0]}</strong><span>${r[1]}</span><span style="font-size:11px">${r[2]}</span></div>`).join('');
 demo.srcdoc=doc('gmail',header('Inbox')+`<div style="display:grid;grid-template-columns:145px 48% 1fr;height:410px"><aside style="padding:24px 16px;background:#151922;color:#aeb7c5">✎ Compose<br><br><strong style="color:#eef2f7">Inbox</strong><br><br>Starred<br><br>Sent<br><br>Drafts<br><br>Labels<br><br>Reading</aside><section>${rows}</section><section style="padding:25px;border-left:1px solid #394456"><h3 style="margin-top:0">The weekend reading list</h3><p style="font-size:12px;color:#aeb7c5">Maya Chen · 10:24 AM</p><div class="a3s"><p>Hi Alex,</p><p>A few thoughtful reads for a slower weekend.</p><p>Start with the short essay on finding time for the things you enjoy.</p><p><a href="#">Open the reading list →</a></p><p>Enjoy your weekend,<br>Maya</p></div></section></div>`);
} else if(view==='email'){
 document.querySelector('#headline').textContent='HTML emails, comfortably dark.';
 document.querySelector('#subtitle').textContent='Text and backgrounds adapt together. Your images keep their own colors.';
 demo.srcdoc=doc('gmail',header('The Sunday Edit')+`<div class="a3s" style="padding:26px 54px;display:grid;grid-template-columns:1fr 1fr;gap:30px"><div style="background:#f8f6ee;color:#292f3c;border-radius:20px;padding:26px"><p style="letter-spacing:4px;font-size:12px">STUDIO NOTES</p><h2 style="font-size:34px;margin:14px 0">Make room for<br>a little inspiration.</h2><p>A collection of ideas for a more thoughtful week.</p><a style="display:inline-block;padding:10px 20px;border-radius:24px;background:#254c77;color:white" href="#">Read this week’s edit</a></div><div style="background:#fff;color:#202124;border-radius:20px;padding:26px"><h2>Three small things</h2><p>01 · Revisit a favorite book.</p><p>02 · Take the scenic route.</p><p>03 · Make something just for fun.</p><p style="color:#1255cc">See you next Sunday.</p></div></div>`);
 demo.onload=()=>{const s=demo.contentDocument.createElement('script');s.src='gmail-messages.js';s.onload=()=>demo.contentWindow.__safariDarkModeMessages.sync(true);demo.contentDocument.body.append(s)};
} else if(view==='sheets'){
 document.querySelector('#headline').textContent='Your spreadsheet, after dark.';
 document.querySelector('#subtitle').textContent='Readable controls and a dark grid. Your cell values and formatting stay intact.';
 demo.srcdoc=doc('sheets',header('Weekly planner')+`<div style="padding:12px 24px;background:#293241;color:#eef2f7">File　Edit　View　Insert　Format　Data　Tools</div><div style="padding:12px 24px;border-bottom:1px solid #445064;color:#eef2f7">↶　↷　　100%　　Sans Serif　　11　　<b>B</b>　<i>I</i>　　▦　　≡</div><div class="grid-container"><div class="grid-table-container"><canvas id="grid" width="1150" height="285" style="width:100%;height:285px"></canvas></div></div><div style="background:#202733;padding:10px 24px;color:#a9c5ff">＋　　Weekly planner ▾　　 Notes ▾</div>`,`const c=document.querySelector('#grid'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1150,285);const rows=[['','A','B','C','D','E','F'],['1','Project','Mon','Tue','Wed','Thu','Fri'],['2','Reading','30 min','30 min','30 min','30 min','30 min'],['3','Focus time','2 hours','2 hours','2 hours','2 hours','2 hours'],['4','Outside','Walk','Cycle','Walk','Walk','Hike'],['5','Creative time','Sketch','Write','Sketch','Write','Create'],['6','','','','','',''],['7','','','','','','']];rows.forEach((r,ri)=>r.forEach((v,ci)=>{let w=ci?183:52,px=ci?52+(ci-1)*183:0,py=ri*35;x.fillStyle=ri===0||ci===0?'#f1f3f4':ri===1?'#b7ddcc':'#fff';x.fillRect(px,py,w,35);x.strokeStyle='#dadce0';x.strokeRect(px,py,w,35);x.fillStyle='#202124';x.font=(ri===1?'bold ':'')+'14px Arial';x.fillText(v,px+12,py+23)}));`);
 document.querySelector('#caption').textContent='Sample sheet · Actual canvas filter · Displayed cell colors change';
} else {
 document.querySelector('#layout').className='split';
 document.querySelector('#layout').innerHTML='<div><h1>Your choice.<br>One click.</h1><p>A separate appearance setting for each supported Google product.</p><div class="bullet"><strong>On</strong> · Always dark<br><strong>Off</strong> · Website default<br><strong>System</strong> · Follow device</div><p class="caption">Actual toolbar controls · Preferences stay on your Mac</p></div><iframe id="popup" title="Appearance controls"></iframe>';
 fetch('../../extension/popup/popup.html').then(r=>r.text()).then(html=>{html=html.replace('<head>','<head><base href="'+new URL('../../extension/popup/',location.href)+'">');const mock=`<script>window.browser={runtime:{},tabs:{query:(o,c)=>c([{id:1,url:'https://mail.google.com/'}]),sendMessage:(i,m,o,c)=>c({product:'gmail',mode:'system'})},storage:{local:{get:(k,c)=>c({enabledBySite:{gmail:'system'}}),set:(d,c)=>c()}}};<\/script>`;html=html.replace('<script src="popup.js">',mock+'<script src="popup.js">');document.querySelector('#popup').srcdoc=html});
}
</script></html>
