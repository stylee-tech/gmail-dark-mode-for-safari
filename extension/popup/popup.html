<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Safari Dark Mode</title>
  </head>
  <body>
    <main>
      <header>
        <span class="moon" aria-hidden="true">☾</span>
        <div><h1>Safari Dark Mode</h1><p class="subtitle">A softer shade of Google.</p></div>
      </header>
      <p class="eyebrow">CURRENT WEBSITE</p>
      <h2 id="site-label">Checking this page…</h2>
      <label class="appearance-label" for="appearance-mode">Appearance</label>
      <select id="appearance-mode" disabled aria-describedby="appearance-status">
        <option value="system">Follow device</option>
        <option value="dark">Dark</option>
        <option value="off">Off</option>
      </select>
      <p id="appearance-status" role="status" aria-live="polite">Connecting to this page…</p>
      <p id="unsupported" hidden>Works with Gmail, Google Sheets, and Google Search.</p>
      <footer>Choose an appearance for this website.<br>Preferences stay on this device.</footer>
    </main>
    <script src="../site-registry.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
