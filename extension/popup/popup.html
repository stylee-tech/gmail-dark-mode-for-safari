<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Gmail Dark Mode for Safari</title>
  </head>
  <body>
    <main>
      <header>
        <span class="moon" aria-hidden="true">☾</span>
        <div><h1>Gmail Dark Mode for Safari</h1><p class="subtitle">A softer shade of Google.</p></div>
      </header>
      <p class="eyebrow">CURRENT WEBSITE</p>
      <h2 id="site-label">Checking this page…</h2>
      <fieldset id="appearance-mode" disabled aria-describedby="appearance-status">
        <legend>Appearance</legend>
        <label class="appearance-choice">
          <input type="radio" name="appearance" value="dark">
          <span><strong>On</strong> <span class="choice-detail">(Always dark)</span></span>
        </label>
        <label class="appearance-choice">
          <input type="radio" name="appearance" value="off">
          <span><strong>Off</strong> <span class="choice-detail">(Website default)</span></span>
        </label>
        <label class="appearance-choice">
          <input type="radio" name="appearance" value="system">
          <span><strong>System</strong> <span class="choice-detail">(Follow device)</span></span>
        </label>
      </fieldset>
      <p id="appearance-status" role="status" aria-live="polite">Connecting to this page…</p>
      <button id="retry-connection" type="button" hidden>Retry connection</button>
      <p id="unsupported" hidden>Works with Gmail, Google Sheets, and Google Search.</p>
      <footer>Choose an appearance for this website.<br>Preferences stay on this device.</footer>
    </main>
    <script src="../site-registry.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
